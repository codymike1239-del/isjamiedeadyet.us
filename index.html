<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Are They Dead?</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;

      display: flex;
      align-items: center;
      justify-content: center;

      background: #111;
      color: #eee;

      font-family: Arial, sans-serif;
    }

    .container {
      text-align: center;
      padding: 20px;
    }

    .question {
      font-size: 2rem;
      font-weight: bold;
      margin-bottom: 15px;
    }

    .person-selector {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 25px;
    }

    .person-selector button {
      background: none;
      border: none;

      color: #aaa;

      font-size: 2.5rem;

      cursor: pointer;

      padding: 10px;

      transition: color 0.2s;
    }

    .person-selector button:hover {
      color: #fff;
    }

    h1 {
      font-size: 2.5rem;
      margin-bottom: 5px;
    }

    .status {
      font-size: 5rem;
      font-weight: bold;
      margin: 20px 0;
    }

    .age {
      font-size: 1.25rem;
      color: #bbb;

      margin-top: 15px;

      line-height: 1.6;
    }

    .countdown {
      font-size: 1.2rem;
      color: #ccc;

      margin-top: 20px;
    }

    .countdown-label {
      font-size: 1.2rem;
      color: #bbb;

      margin-top: 20px;
      margin-bottom: 5px;
    }

    .countdown-bar {
      width: 100%;
      max-width: 600px;

      height: 20px;

      background: #333;

      border-radius: 10px;

      margin: 10px auto 0;

      overflow: hidden;
    }

    .countdown-fill {
      height: 100%;

      width: 100%;

      background: #45d483;

      border-radius: 10px;

      transition:
        width 1s linear,
        background 0.3s;
    }


    /* ==========================================
       GOON COUNTER
       ========================================== */

    .goon-counter {
      width: 180px;

      padding: 15px;

      background: #1c1c1c;

      border: 1px solid #333;

      border-radius: 10px;

      text-align: center;

      margin: 25px auto 0;
    }

    .goon-title {
      color: #aaa;

      font-size: 1rem;

      margin-bottom: 5px;
    }

    .goon-number {
      color: #45d483;

      font-size: 2.5rem;

      font-weight: bold;
    }

    .goon-limit {
      color: #666;

      font-size: 0.8rem;
    }


    /* ==========================================
       FINN EATS COUNTERS
       ========================================== */

    .eats-counters {
      display: none;

      position: absolute;

      right: 30px;
      top: 30px;

      gap: 15px;

      justify-content: center;

      flex-wrap: wrap;
    }

    .eats-counter {
      width: 170px;

      padding: 15px;

      background: #1c1c1c;

      border: 1px solid #333;

      border-radius: 10px;

      text-align: center;
    }

    .eats-title {
      color: #aaa;

      font-size: 0.95rem;

      margin-bottom: 5px;
    }

    .eats-number {
      font-size: 2.2rem;

      font-weight: bold;
    }

    .good-eats .eats-number {
      color: #45d483;
    }

    .bad-eats .eats-number {
      color: #ff5c5c;
    }

    .eats-limit {
      color: #666;

      font-size: 0.8rem;
    }


    /* ==========================================
       SUBTITLE
       ========================================== */

    .subtitle {
      color: #777;

      font-size: 0.9rem;

      margin-top: 20px;
    }

    .updated {
      margin-top: 25px;

      color: #555;

      font-size: 0.75rem;
    }


    /* ==========================================
       MOBILE
       ========================================== */

    @media (max-width: 700px) {

      .eats-counters {
        position: static;

        margin: 25px auto 0;
      }

      .goon-counter {
        margin: 25px auto 0;
      }

    }

  </style>

</head>


<body>

  <div class="container">


    <!-- ==========================================
         QUESTION
         ========================================== -->

    <div
      class="question"
      id="question"
    >
      Is he dead?
    </div>


    <!-- ==========================================
         PERSON SELECTOR
         ========================================== -->

    <div class="person-selector">

      <button onclick="previousPerson()">
        ←
      </button>

      <h1 id="name">
        Jamie
      </h1>

      <button onclick="nextPerson()">
        →
      </button>

    </div>


    <!-- ==========================================
         STATUS
         ========================================== -->

    <div
      class="status"
      id="status"
    ></div>


    <!-- ==========================================
         AGE
         ========================================== -->

    <div
      class="age"
      id="age"
    ></div>


    <!-- ==========================================
         DEATH COUNTDOWN
         ========================================== -->

    <div class="countdown-label">
      Left to live:
    </div>

    <div
      class="countdown"
      id="countdown"
    ></div>


    <!-- ==========================================
         COUNTDOWN BAR
         ========================================== -->

    <div class="countdown-bar">

      <div
        class="countdown-fill"
        id="countdownFill"
      ></div>

    </div>


    <!-- ==========================================
         GOON COUNTER
         ========================================== -->

    <div
      class="goon-counter"
      id="goonCounter"
    >

      <div class="goon-title">
        Goon Counter
      </div>

      <div
        class="goon-number"
        id="goonNumber"
      >
        0
      </div>

      <div class="goon-limit">
        / 1000
      </div>

    </div>


    <!-- ==========================================
         FINN EATS COUNTERS
         ========================================== -->

    <div
      class="eats-counters"
      id="eatsCounters"
    >


      <!-- GOOD EATS -->

      <div
        class="eats-counter good-eats"
      >

        <div class="eats-title">
          Good Eats Counter
        </div>

        <div
          class="eats-number"
          id="goodEatsNumber"
        >
          0
        </div>

        <div class="eats-limit">
          / 24
        </div>

      </div>


      <!-- BAD EATS -->

      <div
        class="eats-counter bad-eats"
      >

        <div class="eats-title">
          Bad Eats Counter
        </div>

        <div
          class="eats-number"
          id="badEatsNumber"
        >
          0
        </div>

        <div class="eats-limit">
          / 24
        </div>

      </div>

    </div>


    <!-- ==========================================
         SUBTITLE
         ========================================== -->

    <div class="subtitle">
      Extremely reliable information
    </div>

    <div class="updated">
      Last checked: Definitely
    </div>

  </div>


  <script>


    // ==========================================
    // CREATE FINN DEATH DATE
    // ==========================================

    function createFinnDeathDate() {

      const deathDate =
        new Date();

      deathDate.setFullYear(
        deathDate.getFullYear() + 210
      );

      deathDate.setMonth(
        deathDate.getMonth() + 56
      );

      deathDate.setDate(
        deathDate.getDate() + (43 * 7)
      );

      deathDate.setDate(
        deathDate.getDate() + 20
      );

      deathDate.setHours(
        deathDate.getHours() + 45
      );

      deathDate.setMinutes(
        deathDate.getMinutes() + 3
      );

      deathDate.setSeconds(
        deathDate.getSeconds() + 10
      );

      return deathDate;

    }


    // ==========================================
    // CREATE ZANA DEATH DATE
    // ==========================================

    function createZanaDeathDate() {

      const deathDate =
        new Date();

      deathDate.setFullYear(
        deathDate.getFullYear() + 98
      );

      deathDate.setMonth(
        deathDate.getMonth() + 42
      );

      deathDate.setDate(
        deathDate.getDate() + (12 * 7)
      );

      deathDate.setDate(
        deathDate.getDate() + 23
      );

      deathDate.setHours(
        deathDate.getHours() + 4
      );

      deathDate.setMinutes(
        deathDate.getMinutes() + 6
      );

      deathDate.setSeconds(
        deathDate.getSeconds() + 50
      );

      return deathDate;

    }


    // ==========================================
    // PEOPLE
    // ==========================================

    const people = [

      // ========================================
      // JAMIE
      // ========================================

      {

        name: "Jamie",

        gender: "he",

        birthDate: new Date(
          2012,
          9,
          7,
          13,
          0,
          0
        ),

        deathDate: new Date(
          2056,
          7,
          11,
          6,
          0,
          45
        ),

        hasGoonCounter: true,

        goonCount: 0,

        lastGoonDay:
          new Date().toDateString()

      },


      // ========================================
      // ZANA
      // ========================================

      {

        name: "Zana",

        gender: "she",

        birthDate: new Date(
          2013,
          1,
          12,
          17,
          0,
          0
        ),

        deathDate:
          createZanaDeathDate(),

        hasGoonCounter: false,

        goonCount: 0,

        lastGoonDay:
          new Date().toDateString()

      },


      // ========================================
      // FINN
      // ========================================

      {

        name: "Finn",

        gender: "he",

        birthDate: new Date(
          2013,
          2,
          10,
          0,
          0,
          0
        ),

        deathDate:
          createFinnDeathDate(),

        hasGoonCounter: true,

        goonCount: 0,

        lastGoonDay:
          new Date().toDateString()

      }

    ];


    // ==========================================
    // CURRENT PERSON
    // ==========================================

    let currentPerson = 0;


    // ==========================================
    // LIMITS
    // ==========================================

    const GOON_LIMIT = 1000;

    const EATS_LIMIT = 24;


    // ==========================================
    // FINN EATS COUNTERS
    // ==========================================

    let goodEats = 0;

    let badEats = 0;


    // ==========================================
    // STORAGE KEYS
    // ==========================================

    const GOON_STORAGE_KEY =
      "areTheyDead_goonCounters";

    const EATS_STORAGE_KEY =
      "areTheyDead_eatsCounters";


    // ==========================================
    // GET HTML ELEMENTS
    // ==========================================

    const name =
      document.getElementById("name");

    const question =
      document.getElementById("question");

    const status =
      document.getElementById("status");

    const age =
      document.getElementById("age");

    const countdown =
      document.getElementById("countdown");

    const countdownFill =
      document.getElementById("countdownFill");

    const goonCounter =
      document.getElementById("goonCounter");

    const goonNumber =
      document.getElementById("goonNumber");

    const eatsCounters =
      document.getElementById("eatsCounters");

    const goodEatsNumber =
      document.getElementById("goodEatsNumber");

    const badEatsNumber =
      document.getElementById("badEatsNumber");


    // ==========================================
    // LOAD GOON COUNTERS
    // ==========================================

    function loadGoonCounters() {

      const saved =
        localStorage.getItem(
          GOON_STORAGE_KEY
        );

      if (!saved) {
        return;
      }

      try {

        const data =
          JSON.parse(saved);

        for (
          const person of people
        ) {

          if (!person.hasGoonCounter) {
            continue;
          }

          if (
            data[person.name] &&
            typeof data[person.name].count ===
            "number"
          ) {

            person.goonCount =
              Math.min(
                data[person.name].count,
                GOON_LIMIT
              );

            person.lastGoonDay =
              data[person.name].lastDay ||
              new Date().toDateString();

          }

        }

      } catch (error) {

        console.error(
          "Could not load Goon counters:",
          error
        );

      }

    }


    // ==========================================
    // SAVE GOON COUNTERS
    // ==========================================

    function saveGoonCounters() {

      const data = {};

      for (
        const person of people
      ) {

        if (!person.hasGoonCounter) {
          continue;
        }

        data[person.name] = {

          count:
            person.goonCount,

          lastDay:
            person.lastGoonDay

        };

      }

      localStorage.setItem(

        GOON_STORAGE_KEY,

        JSON.stringify(data)

      );

    }


    // ==========================================
    // LOAD EATS COUNTERS
    // ==========================================

    function loadEatsCounters() {

      const saved =
        localStorage.getItem(
          EATS_STORAGE_KEY
        );

      if (!saved) {
        return;
      }

      try {

        const data =
          JSON.parse(saved);

        if (
          typeof data.good === "number"
        ) {

          goodEats =
            Math.min(
              data.good,
              EATS_LIMIT
            );

        }

        if (
          typeof data.bad === "number"
        ) {

          badEats =
            Math.min(
              data.bad,
              EATS_LIMIT
            );

        }

      } catch (error) {

        console.error(
          "Could not load Eats counters:",
          error
        );

      }

    }


    // ==========================================
    // SAVE EATS COUNTERS
    // ==========================================

    function saveEatsCounters() {

      localStorage.setItem(

        EATS_STORAGE_KEY,

        JSON.stringify({

          good: goodEats,

          bad: badEats

        })

      );

    }


    // ==========================================
    // CALCULATE AGE
    // ==========================================

    function calculateAge(birthDate) {

      const now =
        new Date();

      let years =
        now.getFullYear() -
        birthDate.getFullYear();

      const birthdayThisYear =
        new Date(

          now.getFullYear(),

          birthDate.getMonth(),

          birthDate.getDate(),

          birthDate.getHours(),

          birthDate.getMinutes(),

          birthDate.getSeconds()

        );

      if (
        now <
        birthdayThisYear
      ) {

        years--;

      }

      const afterYears =
        new Date(

          birthDate.getFullYear() + years,

          birthDate.getMonth(),

          birthDate.getDate(),

          birthDate.getHours(),

          birthDate.getMinutes(),

          birthDate.getSeconds()

        );

      let months = 0;

      let monthDate =
        new Date(afterYears);

      while (true) {

        const nextMonth =
          new Date(

            monthDate.getFullYear(),

            monthDate.getMonth() + 1,

            monthDate.getDate(),

            birthDate.getHours(),

            birthDate.getMinutes(),

            birthDate.getSeconds()

          );

        if (
          nextMonth <= now
        ) {

          monthDate =
            nextMonth;

          months++;

        } else {

          break;

        }

      }

      let remainingTime =
        now - monthDate;

      const millisecondsPerHour =
        1000 * 60 * 60;

      const millisecondsPerDay =
        millisecondsPerHour * 24;

      const millisecondsPerWeek =
        millisecondsPerDay * 7;

      const weeks =
        Math.floor(
          remainingTime /
          millisecondsPerWeek
        );

      remainingTime -=
        weeks *
        millisecondsPerWeek;

      const days =
        Math.floor(
          remainingTime /
          millisecondsPerDay
        );

      remainingTime -=
        days *
        millisecondsPerDay;

      const hours =
        Math.floor(
          remainingTime /
          millisecondsPerHour
        );

      age.textContent =

        `${people[currentPerson].name} Is ` +

        `${years} years ` +

        `${months} months ` +

        `${weeks} weeks ` +

        `${days} days ` +

        `${hours} hours old.`;

    }


    // ==========================================
    // DEATH COUNTDOWN
    // ==========================================

    function updateCountdown() {

      const person =
        people[currentPerson];

      if (!person.deathDate) {

        countdown.textContent =
          "No death countdown.";

        countdownFill.style.width =
          "0%";

        return;

      }

      const now =
        new Date();

      let remainingTime =
        person.deathDate - now;


      // DEATH DATE REACHED

      if (
        remainingTime <= 0
      ) {

        countdown.textContent =
          "TIME'S UP";

        countdownFill.style.width =
          "0%";

        countdownFill.style.background =
          "#ff5c5c";

        status.textContent =
          "YES";

        status.style.color =
          "#ff5c5c";

        return;

      }


      // YEARS

      let years =
        person.deathDate.getFullYear() -
        now.getFullYear();

      const deathDateThisYear =
        new Date(

          now.getFullYear(),

          person.deathDate.getMonth(),

          person.deathDate.getDate(),

          person.deathDate.getHours(),

          person.deathDate.getMinutes(),

          person.deathDate.getSeconds()

        );

      if (
        now >=
        deathDateThisYear
      ) {

        years--;

      }


      // MONTHS

      const afterYears =
        new Date(

          now.getFullYear() + years,

          now.getMonth(),

          now.getDate(),

          now.getHours(),

          now.getMinutes(),

          now.getSeconds()

        );

      let months = 0;

      let monthDate =
        new Date(afterYears);

      while (true) {

        const nextMonth =
          new Date(

            monthDate.getFullYear(),

            monthDate.getMonth() + 1,

            monthDate.getDate(),

            monthDate.getHours(),

            monthDate.getMinutes(),

            monthDate.getSeconds()

          );

        if (
          nextMonth <=
          person.deathDate
        ) {

          monthDate =
            nextMonth;

          months++;

        } else {

          break;

        }

      }


      // REMAINING TIME

      remainingTime =
        person.deathDate -
        monthDate;

      const millisecondsPerSecond =
        1000;

      const millisecondsPerMinute =
        millisecondsPerSecond * 60;

      const millisecondsPerHour =
        millisecondsPerMinute * 60;

      const millisecondsPerDay =
        millisecondsPerHour * 24;

      const millisecondsPerWeek =
        millisecondsPerDay * 7;

      const weeks =
        Math.floor(
          remainingTime /
          millisecondsPerWeek
        );

      remainingTime -=
        weeks *
        millisecondsPerWeek;

      const days =
        Math.floor(
          remainingTime /
          millisecondsPerDay
        );

      remainingTime -=
        days *
        millisecondsPerDay;

      const hours =
        Math.floor(
          remainingTime /
          millisecondsPerHour
        );

      remainingTime -=
        hours *
        millisecondsPerHour;

      const minutes =
        Math.floor(
          remainingTime /
          millisecondsPerMinute
        );

      remainingTime -=
        minutes *
        millisecondsPerMinute;

      const seconds =
        Math.floor(
          remainingTime /
          millisecondsPerSecond
        );


      // DISPLAY

      countdown.textContent =

        `${years} years ` +

        `${months} months ` +

        `${weeks} weeks ` +

        `${days} days ` +

        `${hours} hours ` +

        `${minutes} minutes ` +

        `${seconds} seconds`;


      // COUNTDOWN BAR

      const totalTime =
        person.deathDate -
        person.birthDate;

      const percentage =

        (person.deathDate - now) /
        totalTime *
        100;

      countdownFill.style.width =

        Math.max(

          0,

          Math.min(

            100,

            percentage

          )

        ) + "%";


      // BAR COLOR

      if (
        percentage <= 10
      ) {

        countdownFill.style.background =
          "#ff5c5c";

      }

      else if (
        percentage <= 25
      ) {

        countdownFill.style.background =
          "#ffb347";

      }

      else {

        countdownFill.style.background =
          "#45d483";

      }

    }


    // ==========================================
    // DISPLAY CURRENT PERSON
    // ==========================================

    function displayPerson() {

      const person =
        people[currentPerson];


      // NAME

      name.textContent =
        person.name;


      // QUESTION

      question.textContent =

        person.gender === "she"

          ? "Is she dead?"

          : "Is he dead?";


      // STATUS

      if (

        person.deathDate &&
        new Date() >=
        person.deathDate

      ) {

        status.textContent =
          "YES";

        status.style.color =
          "#ff5c5c";

      }

      else {

        status.textContent =
          "NO";

        status.style.color =
          "#45d483";

      }


      // AGE

      calculateAge(
        person.birthDate
      );


      // COUNTDOWN

      updateCountdown();


      // GOON COUNTER

      if (
        person.hasGoonCounter
      ) {

        goonCounter.style.display =
          "block";

        updateGoonCounter();

      }

      else {

        goonCounter.style.display =
          "none";

      }


      // FINN EATS COUNTERS

      if (
        person.name === "Finn"
      ) {

        eatsCounters.style.display =
          "flex";

        updateEatsCounters();

      }

      else {

        eatsCounters.style.display =
          "none";

      }

    }


    // ==========================================
    // NEXT PERSON
    // ==========================================

    function nextPerson() {

      currentPerson++;

      if (
        currentPerson >=
        people.length
      ) {

        currentPerson = 0;

      }

      displayPerson();

    }


    // ==========================================
    // PREVIOUS PERSON
    // ==========================================

    function previousPerson() {

      currentPerson--;

      if (
        currentPerson < 0
      ) {

        currentPerson =
          people.length - 1;

      }

      displayPerson();

    }


    // ==========================================
    // UPDATE GOON COUNTER
    // ==========================================

    function updateGoonCounter() {

      const person =
        people[currentPerson];

      if (
        !person.hasGoonCounter
      ) {

        return;

      }

      goonNumber.textContent =
        person.goonCount;

    }


    // ==========================================
    // CHECK FOR NEW DAY
    // ==========================================

    function checkGoonDay() {

      const today =
        new Date().toDateString();

      let changed = false;

      for (
        const person of people
      ) {

        if (
          !person.hasGoonCounter
        ) {

          continue;

        }

        if (
          person.lastGoonDay !==
          today
        ) {

          person.goonCount =
            0;

          person.lastGoonDay =
            today;

          changed = true;

        }

      }

      if (changed) {

        saveGoonCounters();

      }

      updateGoonCounter();

    }


    // ==========================================
    // INCREASE GOON COUNTERS
    // ==========================================

    function increaseGoonCounter() {

      checkGoonDay();

      for (
        const person of people
      ) {

        if (
          !person.hasGoonCounter
        ) {

          continue;

        }

        if (
          person.goonCount >=
          GOON_LIMIT
        ) {

          person.goonCount =
            GOON_LIMIT;

          continue;

        }


        // Random number from 1 to 10

        const increase =
          Math.floor(
            Math.random() * 10
          ) + 1;


        person.goonCount +=
          increase;


        // Never exceed 1000

        if (
          person.goonCount >
          GOON_LIMIT
        ) {

          person.goonCount =
            GOON_LIMIT;

        }

      }

      saveGoonCounters();

      updateGoonCounter();

    }


    // ==========================================
    // UPDATE EATS COUNTERS
    // ==========================================

    function updateEatsCounters() {

      goodEatsNumber.textContent =
        goodEats;

      badEatsNumber.textContent =
        badEats;

    }


    // ==========================================
    // INCREASE EATS COUNTER
    // ==========================================

    function increaseEatsCounter() {

      // 50/50 chance

      const good =
        Math.random() < 0.5;


      if (good) {

        if (
          goodEats <
          EATS_LIMIT
        ) {

          goodEats++;

        }

      }

      else {

        if (
          badEats <
          EATS_LIMIT
        ) {

          badEats++;

        }

      }

      saveEatsCounters();

      updateEatsCounters();

    }


    // ==========================================
    // LOAD SAVED COUNTERS
    // ==========================================

    loadGoonCounters();

    loadEatsCounters();


    // ==========================================
    // INITIAL DISPLAY
    // ==========================================

    displayPerson();


    // ==========================================
    // UPDATE EVERYTHING EVERY SECOND
    // ==========================================

    setInterval(
